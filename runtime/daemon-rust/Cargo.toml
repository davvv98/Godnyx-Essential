[package]
name = "onyx-essential-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Only the two declared Onyx executables are build targets.
autobins = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "onyx_essential_backend"
path = "src/lib.rs"

[[bin]]
name = "onyx_daemon"
path = "src/bin/onyx_daemon.rs"

[[bin]]
name = "onyx_ctl"
path = "src/bin/onyx_ctl.rs"
